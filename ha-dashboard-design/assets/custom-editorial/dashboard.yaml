# Generated by aurora@aurora-smart-home (home-assistant skill)
# https://github.com/tonylofgren/aurora-smart-home
# Dashboard YAML: paste the whole file into a dashboard Raw Configuration Editor,
# or register it as a named YAML dashboard with filename: dashboards/editorial.yaml.
# Dependencies: button-card and layout-card. Replace all *_replace_me entity IDs.
title: Our home
button_card_templates:
  editorial_tile:
    show_state: true
    tap_action:
      action: more-info
    styles:
      card:
        - min-height: 156px
        - padding: 24px
        - border-radius: 4px
        - background: var(--card-background-color)
        - color: var(--primary-text-color)
        - box-shadow: none
      grid:
        - grid-template-areas: '"n i" "s s"'
        - grid-template-columns: 1fr 32px
        - grid-template-rows: auto 1fr
      name:
        - justify-self: start
        - white-space: normal
        - text-align: left
        - font-size: 16px
      icon:
        - width: 24px
        - color: var(--editorial-accent)
      state:
        - justify-self: start
        - align-self: end
        - font-size: clamp(24px, 4vw, 40px)
        - white-space: normal
        - text-align: left
    state_display: >-
      [[[ if (!entity || ['unknown', 'unavailable'].includes(entity.state)) return 'Unavailable';
          return entity.state + (entity.attributes.unit_of_measurement ? ' ' + entity.attributes.unit_of_measurement : ''); ]]]
  editorial_light:
    template: editorial_tile
    tap_action:
      action: toggle
    hold_action:
      action: more-info
    state_display: >-
      [[[ if (!entity || ['unknown', 'unavailable'].includes(entity.state)) return 'Unavailable';
          return entity.state === 'on' ? 'On' : 'Off'; ]]]
    state:
      - value: "on"
        styles:
          card:
            - background: var(--editorial-on-surface)
views:
  - title: Home
    path: home
    type: panel
    theme: Aurora Editorial
    cards:
      - type: custom:layout-card
        layout_type: custom:grid-layout
        layout:
          grid-template-columns: minmax(0, 2fr) minmax(0, 1fr) minmax(0, 1fr)
          grid-template-areas: |
            "intro intro intro"
            "temperature humidity power"
            "living kitchen bedroom"
          grid-gap: 16px
          margin: 0
          padding: 24px
          mediaquery:
            "(max-width: 600px)":
              grid-template-columns: minmax(0, 1fr)
              grid-template-areas: |
                "intro"
                "temperature"
                "humidity"
                "power"
                "living"
                "kitchen"
                "bedroom"
              padding: 12px
            "(max-width: 1000px)":
              grid-template-columns: repeat(2, minmax(0, 1fr))
              grid-template-areas: |
                "intro intro"
                "temperature temperature"
                "humidity power"
                "living kitchen"
                "bedroom bedroom"
        cards:
          - type: custom:button-card
            name: A quieter kind of home.
            label: AT A GLANCE / CLIMATE & LIGHT
            show_label: true
            show_icon: false
            tap_action:
              action: none
            view_layout:
              grid-area: intro
            styles:
              card:
                - background: transparent
                - border: none
                - box-shadow: none
                - padding: 24px 0 32px
              grid:
                - grid-template-areas: '"l" "n"'
                - grid-template-columns: 1fr
              name:
                - justify-self: start
                - text-align: left
                - white-space: normal
                - font-family: var(--editorial-heading-font)
                - font-size: clamp(34px, 6vw, 72px)
                - line-height: 1.1
              label:
                - justify-self: start
                - white-space: normal
                - letter-spacing: 0.12em
                - font-size: 12px
                - color: var(--secondary-text-color)
                - padding-bottom: 20px
          - type: custom:button-card
            template: editorial_tile
            entity: sensor.indoor_temperature_replace_me
            name: Indoor temperature
            icon: mdi:thermometer
            view_layout:
              grid-area: temperature
          - type: custom:button-card
            template: editorial_tile
            entity: sensor.indoor_humidity_replace_me
            name: Humidity
            icon: mdi:water-percent
            view_layout:
              grid-area: humidity
          - type: custom:button-card
            template: editorial_tile
            entity: sensor.home_power_replace_me
            name: Power now
            icon: mdi:lightning-bolt
            view_layout:
              grid-area: power
          - type: custom:button-card
            template: editorial_light
            entity: light.living_room_replace_me
            name: Living room
            icon: mdi:floor-lamp
            view_layout:
              grid-area: living
          - type: custom:button-card
            template: editorial_light
            entity: light.kitchen_replace_me
            name: Kitchen
            icon: mdi:ceiling-light
            view_layout:
              grid-area: kitchen
          - type: custom:button-card
            template: editorial_light
            entity: light.bedroom_replace_me
            name: Bedroom
            icon: mdi:lamp
            view_layout:
              grid-area: bedroom
